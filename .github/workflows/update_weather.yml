name: Update Suwon Weather

on:
  schedule:
    # cron-job.org가 매시 0분·30분에 workflow_dispatch로 정확히 트리거하는 게 주 트리거.
    # 이건 그게 실패했을 때를 위한 백업이라 1시간에 1회, 겹치지 않게 15분에 실행.
    - cron: "15 * * * *"
  workflow_dispatch: # cron-job.org(외부 스케줄러) 및 GitHub UI 수동 실행용
    inputs: {}

permissions:
  contents: write   # GITHUB_TOKEN으로 커밋/푸시하려면 contents: write 권한 필요

jobs:
  update-weather:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Generate Suwon weather JSON
        env:
          KMA_SERVICE_KEY: ${{ secrets.KMA_SERVICE_KEY }}
        run: |
          run_provider="kma"
          run_air="kma"
          sido_name="경기"

          # 키가 없으면 KMA 대신 open-meteo로 자동 폴백
          if [ -z "$KMA_SERVICE_KEY" ]; then
            echo "[WARN] KMA_SERVICE_KEY not set. Falling back to open-meteo for weather/air." >&2
            run_provider="open-meteo"
            run_air="open-meteo"
          fi

          python fetch_weather.py \
            --provider "$run_provider" \
            --air-provider "$run_air" \
            --kma-air-sido-name "$sido_name" \
            || {
              if [ "$run_provider" = "kma" ]; then
                echo "[WARN] KMA fetch failed, retrying with open-meteo." >&2
                run_provider="open-meteo"
                run_air="open-meteo"
                python fetch_weather.py \
                  --provider "$run_provider" \
                  --air-provider "$run_air" \
                  --kma-air-sido-name "$sido_name"
              fi
            }

      - name: Commit and push changes
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

          git add data/src_weather.json

          if ! git diff --staged --quiet; then
            git commit -m "Update Suwon weather data [auto]"
            git fetch origin main
            git rebase -X ours origin/main || (git rebase --abort && git pull origin main --no-rebase)
            git push origin HEAD:main
          else
            echo "No weather data changes to commit."
          fi
